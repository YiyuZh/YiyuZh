# .github/workflows/github-data.yml in YiyuZh/YiyuZh (the profile repository).
# Every six hours, rebuild github.json with .github/scripts/github-snapshot.py
# (a copy of scripts/github-snapshot.py in the Portal repository): the public
# contribution calendar, stars, repositories and pull requests to other
# people's repositories. The file goes to the "data" branch as a single commit.
# The Portal API reads it through api.github.com and caches it, so the homepage
# follows within minutes and the server needs no secret.
name: Update GitHub data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/github-snapshot.py"
      - ".github/scripts/star-badges.py"
      - ".github/workflows/github-data.yml"

permissions:
  contents: write

concurrency:
  group: github-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build github.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 .github/scripts/github-snapshot.py --login "${{ github.repository_owner }}" --out dist/github.json
          python3 -c "import json; d = json.load(open('dist/github.json')); assert len(d['calendar']['days']) >= 300, 'calendar too short'"

      # The README's "stars" badges, pre-rendered so a slow shields.io never
      # breaks the README. Keeps the last good copy if shields is down.
      - name: Render star badges
        run: python3 .github/scripts/star-badges.py --data dist/github.json --out dist/badges --owner "${{ github.repository_owner }}"

      - name: Publish to the data branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: data
          build_dir: dist
          commit_message: Update GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
